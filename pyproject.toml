[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-financial-multi-agent"
version = "0.1.0"
description = "Khung đa tác nhân thích ứng cho phân tích báo cáo tài chính tiếng Việt có dẫn nguồn."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135,<1",
    "uvicorn>=0.41,<1",
    "python-multipart>=0.0.22,<1",
    "pydantic>=2,<3",
    "Pillow>=11,<13",
    "google-genai==2.33.0",
    "jsonschema>=4.26,<5",
    "tzdata>=2025.2",
    "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

# Giữ các đường dẫn src/<module> theo M0-01, nhưng sử dụng một namespace
# khi import để tránh xung đột với các package chung như core, tools, api.
[tool.setuptools]
packages = [
    "vietnamese_financial_multi_agent",
    "vietnamese_financial_multi_agent.core",
    "vietnamese_financial_multi_agent.document_processing",
    "vietnamese_financial_multi_agent.document_processing.contracts",
    "vietnamese_financial_multi_agent.accounting",
    "vietnamese_financial_multi_agent.evidence",
    "vietnamese_financial_multi_agent.tools",
    "vietnamese_financial_multi_agent.agents",
    "vietnamese_financial_multi_agent.verification",
    "vietnamese_financial_multi_agent.outputs",
    "vietnamese_financial_multi_agent.api",
]
include-package-data = false

[tool.setuptools.package-dir]
vietnamese_financial_multi_agent = "src"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
markers = [
    "integration: kiểm tra tương tác giữa các module hoặc dịch vụ",
    "evaluation: đánh giá chất lượng trên tập dữ liệu đã được duyệt",
]
