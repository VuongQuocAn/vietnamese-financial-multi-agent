name: EO release checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[rag,dev,benchmark]'
      - run: python scripts/run_agent_v2.py --help
      - run: python -m pytest tests/unit
