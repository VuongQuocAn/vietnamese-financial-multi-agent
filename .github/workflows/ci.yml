name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run all unit and browser tests for a milestone or Tech Lead review
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.changes.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes affecting web validation
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- web src pyproject.toml .github/workflows/ci.yml; then
            echo "web=false" >> "$GITHUB_OUTPUT"
          else
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Validate task tracking
        run: python scripts/check_planning.py
      - name: Focused unit tests (offline)
        if: ${{ !inputs.full_regression }}
        run: >-
          python -m pytest tests/unit/test_package.py tests/unit/test_api.py
          tests/unit/test_llm_gateway.py::test_routing_and_explicit_model_configuration_without_network
          tests/unit/test_financial_query.py::test_raw_retrieval_is_grounded_and_immutable
          tests/unit/test_extraction_sessions.py
      - name: Full unit regression (manual)
        if: ${{ inputs.full_regression }}
        run: python -m pytest tests/unit

  web:
    name: Web smoke
    needs: quality
    if: ${{ needs.quality.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP layer
        run: python -m pip install .
      - name: Install frontend
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Routes, browser and proxy smoke
        working-directory: web
        shell: bash
        env:
          FULL_REGRESSION: ${{ inputs.full_regression }}
        run: |
          python -m uvicorn vietnamese_financial_multi_agent.api.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          npm run start > "$RUNNER_TEMP/web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"
            exit 1
          fi
          if [ "$FULL_REGRESSION" = true ]; then
            npm run test:smoke
          else
            npm run test:smoke -- --grep 'dashboard, navigation and truthful empty states|Next.js proxy reaches the real FastAPI health endpoint|real upload, manual confirmation and document list at 1440px'
          fi
